[package]
name = "jvault"
version = "0.1.0"
description = "JVault — Game Library Launcher"
authors = ["curator"]
edition = "2021"

[lib]
name = "jvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jvault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.8.0"
log = "0.4.29"
tauri-plugin-dialog = "2.7.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
